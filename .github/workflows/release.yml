name: release

# 变体：dsh-bash-terminal-ts 手写（不走模板渲染）
# 原因：runs-on=windows-latest（UIA/terminal 测试需原生 Windows PTY）；
#       门禁跑 node test-dist/*.js（编译产物级测试，非 npm run test）
# 必须包含：id-token: write + --provenance --access public

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:      { description: '要发布的 tag（如 v0.9.2）', required: true, type: string }
      dry_run:  { description: '只打包不推 npm', type: boolean, default: true }

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # ① 版本对齐
      - name: 版本对齐
        run: |
          set -euo pipefail
          V="${TAG#v}"
          P=$(node -p "require('./package.json').version")
          [ "$V" = "$P" ] || { echo "::error::tag $TAG 与 package.json $P 不一致"; exit 1; }
          for f in dsh.plugin.json dsh-plugin.json; do
            [ -f "$f" ] || continue
            D=$(node -p "try{require('./$f').version||''}catch{''}" 2>/dev/null || echo "")
            [ -z "$D" ] || [ "$D" = "$P" ] || { echo "::error::$f 的 $D 与 $P 不一致"; exit 1; }
          done
          echo "VERSION=$P"        >> "$GITHUB_ENV"
          echo "PKG_NAME=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"
        shell: bash

      # ② 安装依赖 + 构建（含额外 peer 包，与 test.yml 对齐）
      - name: 安装依赖与构建
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm install react@^18 react-dom@^18 node-pty@^1 --no-save --no-audit --no-fund
          npm run build
        shell: bash

      # ③ 门禁：逐文件跑 test-dist 编译产物
      - name: 门禁
        run: |
          set -euo pipefail
          node test-dist/unit.js
          node test-dist/apply.js
          node test-dist/client.js
          node test-dist/terminal.js
        shell: bash

      # ④ 打包清单
      - name: 打包清单
        run: npm pack --dry-run
        shell: bash

      # ⑤ 幂等
      - name: 幂等检查
        id: guard
        run: |
          if npm view "$PKG_NAME@$VERSION" version --registry https://registry.npmjs.org 2>/dev/null | grep -q .; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "::warning::$PKG_NAME@$VERSION 已存在于 registry，跳过"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      # ⑥ 发布（rc 版本→ --tag rc，不动 latest）
      - name: npm publish
        if: steps.guard.outputs.exists == 'false' && (github.event_name == 'push' || inputs.dry_run == false)
        shell: bash
        run: |
          set -euo pipefail
          case "$VERSION" in
            *-rc*) echo "::notice::rc 版本 $VERSION → 发到 rc 标签"; npm publish --provenance --access public --tag rc --registry https://registry.npmjs.org ;;
            *)     npm publish --provenance --access public --tag latest --registry https://registry.npmjs.org ;;
          esac

      # ⑦ dist-tag 同步（rc 线跳过，不动 dsh-* 线标签）
      - name: 同步 dsh-* 线标签
        id: disttag
        if: steps.guard.outputs.exists == 'false' && !contains(env.VERSION, '-rc') && (github.event_name == 'push' || inputs.dry_run == false)
        run: |
          set -uo pipefail
          REG=https://registry.npmjs.org
          for attempt in 1 2 3 4 5 6; do
            RAW=$(npm view "$PKG_NAME" dist-tags --json --registry "$REG" 2>/dev/null)
            if [ -n "${RAW:-}" ]; then
              TAGS=$(printf '%s' "$RAW" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(Object.keys(JSON.parse(s)).filter(t=>t.startsWith('dsh-')).join(' '))}catch{console.log('')}})")
              if [ -z "${TAGS:-}" ]; then
                echo "synced=none" >> "$GITHUB_OUTPUT"; exit 0
              fi
              ok=1; for t in $TAGS; do npm dist-tag add "$PKG_NAME@$VERSION" "$t" --registry "$REG" || ok=0; done
              [ "$ok" = 1 ] && { echo "synced=$TAGS" >> "$GITHUB_OUTPUT"; exit 0; }
            fi
            echo "retry $attempt"; sleep 30
          done
          echo "synced=PENDING" >> "$GITHUB_OUTPUT"
        shell: bash

      # ⑧ GitHub Release
      - name: GitHub Release
        if: steps.guard.outputs.exists == 'false' && (github.event_name == 'push' || inputs.dry_run == false)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PRE_FLAG=""
          case "$VERSION" in *-rc*) PRE_FLAG="--prerelease" ;; esac
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes $PRE_FLAG
          case "$VERSION" in *-rc*) : ;; *) gh release edit "$TAG" --latest ;; esac
        shell: bash

      # ⑨ 事实表
      - name: Job Summary
        if: always()
        run: |
          {
            echo "### $TAG"
            echo "| 包 | ${PKG_NAME:-?} |"
            echo "| 版本 | ${VERSION:-?} |"
            echo "| 已存在跳过 | ${{ steps.guard.outputs.exists }} |"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
